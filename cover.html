<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unternehmerin-Identitäts-Report — {{vorname}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Public+Sans:wght@300;400&display=swap');

@page {
  size: A4;
  margin: 0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 210mm;
  height: 297mm;
}

body {
  font-family: 'Public Sans', sans-serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.cover {
  width: 210mm;
  height: 297mm;
  background: #d4c9c6;
  position: relative;
  overflow: hidden;
}

/* Subtle background dot pattern */
.cover::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 12px 12px;
  z-index: 0;
}

/* All content above pattern */
.cover > * {
  position: relative;
  z-index: 1;
}

/* Logo */
.logo {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: auto;
}

/* Ornamental frame */
.ornament-frame {
  position: absolute;
  top: 25%;
  left: 12%;
  width: 76%;
  height: 35%;
  border: 1px solid rgba(163,0,9,0.25);
  z-index: 1;
}

/* Corner decorations — diamonds at each corner */
.ornament-frame .corner {
  position: absolute;
  width: 8px;
  height: 8px;
  background: rgba(163,0,9,0.3);
  transform: rotate(45deg);
}

.ornament-frame .corner.tl { top: -5px; left: -5px; }
.ornament-frame .corner.tr { top: -5px; right: -5px; }
.ornament-frame .corner.bl { bottom: -5px; left: -5px; }
.ornament-frame .corner.br { bottom: -5px; right: -5px; }

/* Small dots near corners */
.ornament-frame .dot {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(163,0,9,0.2);
}

.ornament-frame .dot.tl-h { top: -2px; left: 20px; }
.ornament-frame .dot.tl-v { top: 20px; left: -2px; }
.ornament-frame .dot.tr-h { top: -2px; right: 20px; }
.ornament-frame .dot.tr-v { top: 20px; right: -2px; }
.ornament-frame .dot.bl-h { bottom: -2px; left: 20px; }
.ornament-frame .dot.bl-v { bottom: 20px; left: -2px; }
.ornament-frame .dot.br-h { bottom: -2px; right: 20px; }
.ornament-frame .dot.br-v { bottom: 20px; right: -2px; }

/* Content inside frame */
.frame-content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 30px;
}

/* Decorative line above title */
.line-top {
  position: relative;
  width: 120px;
  height: 1px;
  background: rgba(163,0,9,0.25);
  margin-bottom: 28px;
}
.line-top::before,
.line-top::after {
  content: '';
  position: absolute;
  top: -3px;
  width: 6px;
  height: 6px;
  background: rgba(163,0,9,0.3);
  transform: rotate(45deg);
}
.line-top::before { left: -3px; }
.line-top::after { right: -3px; }

/* Title block */
.title-pre {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 18px;
  color: #444;
  margin-bottom: 8px;
}

.title-main {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 24px;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: #000;
  line-height: 1.3;
  text-align: center;
}

.title-report {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 24px;
  text-transform: uppercase;
  letter-spacing: 8px;
  color: #000;
  margin-bottom: 20px;
}

/* Decorative divider */
.divider {
  position: relative;
  width: 80px;
  height: 1px;
  background: #A30009;
  margin-bottom: 24px;
}
.divider::before {
  content: '';
  position: absolute;
  top: -4px;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 8px;
  height: 8px;
  background: #A30009;
}

/* Line below subtitle area */
.line-bottom {
  position: relative;
  width: 120px;
  height: 1px;
  background: rgba(163,0,9,0.25);
  margin-top: 4px;
}
.line-bottom::before,
.line-bottom::after {
  content: '';
  position: absolute;
  top: -3px;
  width: 6px;
  height: 6px;
  background: rgba(163,0,9,0.3);
  transform: rotate(45deg);
}
.line-bottom::before { left: -3px; }
.line-bottom::after { right: -3px; }

/* Type with emoji */
.type-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
  white-space: nowrap;
}

.type-emoji {
  font-size: 22px;
  line-height: 1;
}

.type-name {
  font-family: 'Playfair Display', serif;
  font-weight: 600;
  font-size: 28px;
  color: #000;
}

/* Person name — below frame */
.person-name {
  position: absolute;
  top: 64%;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Playfair Display', serif;
  font-weight: 600;
  font-size: 36px;
  color: #A30009;
  white-space: nowrap;
}

/* Bottom meta */
.bottom-meta {
  position: absolute;
  top: 82%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
}

.meta-line-decoration {
  width: 50px;
  height: 1px;
  background: #A30009;
  margin: 0 auto 12px;
}

.meta-text {
  font-family: 'Public Sans', sans-serif;
  font-size: 11px;
  color: #555;
  letter-spacing: 1px;
  white-space: nowrap;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 3%;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Public Sans', sans-serif;
  font-size: 10px;
  color: #888;
  white-space: nowrap;
}
</style>
</head>
