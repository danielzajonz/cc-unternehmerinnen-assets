<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Content</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Public+Sans:wght@300;400&display=swap');
@page { size: A4; margin: 0; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Public Sans',sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.art { width:210mm; height:297mm; position:relative; overflow:hidden; background:#f3f0ed; padding:30mm 32mm 24mm 34mm; }
.art-accent { position:absolute; left:18mm; top:30mm; bottom:24mm; width:2px; background:linear-gradient(to bottom,transparent,rgba(163,0,9,0.22) 12%,rgba(163,0,9,0.22) 88%,transparent); }
.art-ghost { position:absolute; right:20mm; top:22mm; font-family:'Playfair Display',serif; font-weight:700; font-size:120px; color:rgba(163,0,9,0.05); line-height:1; }

.art-kicker { font-family:'Oswald',sans-serif; font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:4px; color:#9b8f8a; margin-bottom:6mm; }
.art-kicker b { color:#A30009; font-weight:500; }

.section-title { font-family:'Playfair Display',serif; font-weight:700; font-size:31px; line-height:1.1; color:#1a1a1a; letter-spacing:-0.5px; margin-bottom:5mm; max-width:150mm; }
.divider { width:48px; height:2px; background:#A30009; margin-bottom:7mm; }

.body-text { font-family:'Public Sans',sans-serif; font-weight:300; font-size:11.5px; line-height:1.92; color:#2a2a2a; max-width:152mm; }
.body-text p { margin-bottom:4mm; }
.body-text p:last-child { margin-bottom:0; }

h3.subhead { font-family:'Oswald',sans-serif; font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:2.5px; color:#A30009; margin:7mm 0 3mm 0; }
.body-text h3.subhead:first-child { margin-top:0; }

.foot { position:absolute; bottom:12mm; left:34mm; right:32mm; display:flex; justify-content:space-between; font-family:'Oswald',sans-serif; font-weight:300; font-size:8px; letter-spacing:1.5px; text-transform:uppercase; color:#b3a8a3; border-top:0.5px solid rgba(163,0,9,0.15); padding-top:2.5mm; }
</style>
</head>
<body>
<div class="art">
  <div class="art-accent"></div>
  <div class="art-ghost">{{kapitel_nr}}</div>
  <div class="art-kicker">Kapitel {{kapitel_nr}} &nbsp;·&nbsp; <b>{{kapitel_titel}}</b></div>
{{content}}
  <div class="foot"><span>{{vorname}} {{nachname}} · {{geburtsdatum}}</span><span>© Classy Confidence by Lea Ernst</span></div>
</div>
</body>
</html>
